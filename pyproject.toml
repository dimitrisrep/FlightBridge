[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightbridge"
version = "0.2.0"
description = "Bilingual passenger intake and evaluated schedule-change classification"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.10",
  "joblib>=1.4,<2", "pydantic>=2.9,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "matplotlib>=3.9,<4"]
ui = ["streamlit>=1.40,<2"]
legacy = ["matplotlib>=3.9,<4", "reportlab>=4,<5", "streamlit>=1.40,<2"]

[project.scripts]
flightbridge = "flightbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/portfolio"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
